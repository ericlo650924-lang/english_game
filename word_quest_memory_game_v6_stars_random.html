<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Quest - 單字配對 Memory Game</title>
  <style>
    :root {
      --bg: #f7f1df;
      --panel: #fffaf0;
      --card: #ffffff;
      --card-back: #4f7cac;
      --card-back-2: #315f87;
      --text: #253238;
      --muted: #6b7280;
      --ok: #2f9e44;
      --bad: #d9480f;
      --border: #e3d5b8;
      --shadow: 0 8px 18px rgba(40, 35, 25, 0.12);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Comic Sans MS", "Noto Sans TC", system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, #dff4ff 0, transparent 34%),
        radial-gradient(circle at bottom right, #ffe3b3 0, transparent 34%),
        var(--bg);
      color: var(--text);
    }

    .app {
      max-width: 1120px;
      margin: 0 auto;
      padding: 24px;
    }

    header {
      display: flex;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .title {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 22px;
      padding: 16px 20px;
      box-shadow: var(--shadow);
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 16px;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: repeat(5, minmax(88px, 1fr));
      gap: 10px;
      min-width: min(100%, 460px);
    }

    .stat {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 10px 12px;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .stat .label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat .value {
      font-size: 24px;
      font-weight: 800;
    }

    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 12px;
      margin-bottom: 18px;
      box-shadow: var(--shadow);
    }

    button, select, input[type="range"] {
      font-family: inherit;
      font-size: 16px;
    }

    button, select {
      border-radius: 14px;
      border: 2px solid #b8a981;
      background: #fff;
      padding: 10px 14px;
      cursor: pointer;
    }

    button {
      background: #ffe08a;
      font-weight: 800;
      transition: transform 0.1s ease, filter 0.1s ease;
    }

    button:hover { filter: brightness(1.04); }
    button:active { transform: scale(0.98); }

    .music-on {
      background: #c3fae8;
    }

    .message {
      flex: 1;
      min-width: 240px;
      color: var(--text);
      font-weight: 700;
      padding-left: 4px;
    }

    .volume-box {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(6, minmax(90px, 1fr));
      gap: 12px;
    }

    .card {
      position: relative;
      height: 116px;
      border: 0;
      padding: 0;
      background: transparent;
      perspective: 800px;
    }

    .card-inner {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      transform-style: preserve-3d;
      transition: transform 0.35s ease;
      box-shadow: var(--shadow);
    }

    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }

    .face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 18px;
      border: 3px solid rgba(255,255,255,0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px;
    }

    .back {
      background:
        linear-gradient(135deg, var(--card-back), var(--card-back-2));
      color: white;
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 1px;
    }

    .front {
      transform: rotateY(180deg);
      background: var(--card);
      color: var(--text);
      border-color: var(--border);
      flex-direction: column;
    }

    .card-type {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .word {
      font-size: clamp(18px, 2.5vw, 26px);
      font-weight: 900;
      line-height: 1.15;
    }

    .phonetic {
      margin-top: 7px;
      font-size: clamp(14px, 2vw, 18px);
      color: #495057;
      font-weight: 700;
      line-height: 1.15;
    }

    .speak-hint {
      margin-top: 7px;
      font-size: 20px;
      line-height: 1;
    }

    .english .front { background: #e7f5ff; }
    .chinese .front { background: #fff3bf; }

    .matched .front {
      outline: 4px solid rgba(47, 158, 68, 0.35);
    }

    .wrong .card-inner {
      animation: shake 0.28s ease;
    }

    @keyframes shake {
      0%, 100% { transform: rotateY(180deg) translateX(0); }
      25% { transform: rotateY(180deg) translateX(-6px); }
      75% { transform: rotateY(180deg) translateX(6px); }
    }


    .reward {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      pointer-events: none;
      z-index: 20;
    }

    .reward.show {
      display: grid;
      animation: rewardFade 0.9s ease forwards;
    }

    .reward-card {
      background: rgba(255, 250, 240, 0.96);
      border: 4px solid #ffd43b;
      border-radius: 28px;
      padding: 22px 30px;
      text-align: center;
      box-shadow: 0 16px 36px rgba(0,0,0,0.18);
      transform: scale(0.92);
      animation: pop 0.55s ease forwards;
    }

    .reward-emoji {
      font-size: 58px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .reward-text {
      font-size: 30px;
      font-weight: 900;
    }

    .coin-fly {
      position: fixed;
      left: 50%;
      top: 52%;
      font-size: 30px;
      pointer-events: none;
      z-index: 25;
      animation: coinFly 0.85s ease-out forwards;
    }

    @keyframes rewardFade {
      0% { opacity: 0; }
      15% { opacity: 1; }
      80% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes pop {
      0% { transform: scale(0.72) rotate(-3deg); }
      60% { transform: scale(1.08) rotate(2deg); }
      100% { transform: scale(1) rotate(0); }
    }

    @keyframes coinFly {
      0% { transform: translate(-50%, -50%) scale(0.6); opacity: 0; }
      18% { opacity: 1; }
      100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.35); opacity: 0; }
    }

    .wrong-panel {
      background: var(--panel);
      border: 2px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
      margin-top: 18px;
      box-shadow: var(--shadow);
    }

    .wrong-panel h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .wrong-panel p {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .wrong-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .wrong-chip {
      border: 2px solid #ffc9c9;
      background: #fff5f5;
      border-radius: 999px;
      padding: 7px 10px;
      font-weight: 800;
      font-size: 14px;
    }

    .wrong-chip strong {
      color: #c92a2a;
    }


    .scene {
      position: fixed;
      right: clamp(10px, 3vw, 34px);
      bottom: clamp(10px, 3vw, 30px);
      width: min(220px, 34vw);
      height: min(260px, 42vw);
      pointer-events: none;
      z-index: 8;
      opacity: 0.96;
    }

    .buddy {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 160px;
      height: 185px;
      filter: drop-shadow(0 12px 12px rgba(0,0,0,0.16));
      transform-origin: bottom center;
      animation: buddyIdle 2.5s ease-in-out infinite;
    }

    .buddy-body {
      position: absolute;
      left: 35px;
      bottom: 0;
      width: 92px;
      height: 110px;
      background: linear-gradient(180deg, #ffd43b, #ffb703);
      border: 4px solid #7a4b00;
      border-radius: 48% 48% 42% 42%;
    }

    .buddy-head {
      position: absolute;
      left: 22px;
      top: 10px;
      width: 118px;
      height: 105px;
      background: linear-gradient(180deg, #fff3bf, #ffd43b);
      border: 4px solid #7a4b00;
      border-radius: 52% 52% 46% 46%;
    }

    .buddy-ear {
      position: absolute;
      top: 5px;
      width: 35px;
      height: 48px;
      background: #ffd43b;
      border: 4px solid #7a4b00;
      border-radius: 60% 60% 35% 35%;
      z-index: -1;
    }

    .buddy-ear.left { left: 18px; transform: rotate(-24deg); }
    .buddy-ear.right { right: 18px; transform: rotate(24deg); }

    .buddy-eye {
      position: absolute;
      top: 45px;
      width: 16px;
      height: 20px;
      background: #2b2d42;
      border-radius: 50%;
      transition: all 0.18s ease;
    }

    .buddy-eye.left { left: 42px; }
    .buddy-eye.right { right: 42px; }

    .buddy-cheek {
      position: absolute;
      top: 68px;
      width: 18px;
      height: 10px;
      background: rgba(255, 107, 107, 0.38);
      border-radius: 50%;
    }

    .buddy-cheek.left { left: 26px; }
    .buddy-cheek.right { right: 26px; }

    .buddy-mouth {
      position: absolute;
      left: 52px;
      top: 68px;
      width: 28px;
      height: 16px;
      border-bottom: 5px solid #2b2d42;
      border-radius: 0 0 40px 40px;
      transition: all 0.18s ease;
    }

    .buddy-arm {
      position: absolute;
      top: 112px;
      width: 34px;
      height: 16px;
      background: #ffd43b;
      border: 4px solid #7a4b00;
      border-radius: 999px;
      transform-origin: center;
      transition: transform 0.18s ease;
    }

    .buddy-arm.left { left: 15px; transform: rotate(24deg); }
    .buddy-arm.right { right: 15px; transform: rotate(-24deg); }

    .buddy-feet {
      position: absolute;
      bottom: -6px;
      width: 42px;
      height: 20px;
      background: #ff922b;
      border: 4px solid #7a4b00;
      border-radius: 999px;
    }

    .buddy-feet.left { left: 34px; }
    .buddy-feet.right { right: 34px; }

    .speech {
      position: absolute;
      right: 118px;
      bottom: 160px;
      min-width: 126px;
      max-width: 180px;
      background: rgba(255, 255, 255, 0.95);
      border: 3px solid #7a4b00;
      border-radius: 20px;
      padding: 10px 12px;
      font-weight: 900;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .speech::after {
      content: "";
      position: absolute;
      right: -13px;
      bottom: 14px;
      width: 22px;
      height: 22px;
      background: rgba(255, 255, 255, 0.95);
      border-right: 3px solid #7a4b00;
      border-bottom: 3px solid #7a4b00;
      transform: rotate(-45deg);
    }

    .buddy.happy {
      animation: buddyJump 0.72s ease;
    }

    .buddy.happy .buddy-eye {
      height: 6px;
      top: 53px;
      border-radius: 999px;
    }

    .buddy.happy .buddy-mouth {
      left: 49px;
      top: 66px;
      width: 34px;
      height: 22px;
      border-bottom: 6px solid #2b2d42;
    }

    .buddy.happy .buddy-arm.left { transform: rotate(-32deg) translateY(-8px); }
    .buddy.happy .buddy-arm.right { transform: rotate(32deg) translateY(-8px); }

    .buddy.sad {
      animation: buddyShake 0.5s ease;
    }

    .buddy.sad .buddy-eye {
      height: 18px;
      transform: rotate(8deg);
    }

    .buddy.sad .buddy-mouth {
      top: 78px;
      border-bottom: 0;
      border-top: 5px solid #2b2d42;
      border-radius: 40px 40px 0 0;
    }

    .buddy.thinking .buddy-eye.left {
      height: 6px;
      top: 52px;
      border-radius: 999px;
    }

    .buddy.thinking .buddy-mouth {
      width: 18px;
      height: 10px;
      left: 57px;
      border-bottom: 4px solid #2b2d42;
    }

    @keyframes buddyIdle {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-7px) rotate(1deg); }
    }

    @keyframes buddyJump {
      0%, 100% { transform: translateY(0) scale(1); }
      35% { transform: translateY(-32px) scale(1.04); }
      70% { transform: translateY(0) scale(1.02); }
    }

    @keyframes buddyShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-9px) rotate(-2deg); }
      40% { transform: translateX(9px) rotate(2deg); }
      60% { transform: translateX(-7px) rotate(-2deg); }
      80% { transform: translateX(7px) rotate(2deg); }
    }

    @media (max-width: 760px) {
      .scene {
        width: 130px;
        height: 150px;
        opacity: 0.88;
      }
      .buddy {
        width: 105px;
        height: 125px;
        transform: scale(0.7);
        transform-origin: bottom right;
      }
      .speech {
        display: none;
      }
    }


    .buddy[data-character] .buddy-head,
    .buddy[data-character] .buddy-body,
    .buddy[data-character] .buddy-ear,
    .buddy[data-character] .buddy-arm {
      background: var(--buddy-main);
      border-color: var(--buddy-line);
    }

    .buddy[data-character] .buddy-body {
      background: linear-gradient(180deg, var(--buddy-main), var(--buddy-dark));
    }

    .buddy[data-character] .buddy-head {
      background: linear-gradient(180deg, var(--buddy-light), var(--buddy-main));
    }

    .buddy[data-character] .buddy-mouth,
    .buddy[data-character] .buddy-eye {
      border-color: var(--buddy-face);
      background: var(--buddy-face);
    }

    .buddy[data-character] .buddy-feet {
      background: var(--buddy-accent);
      border-color: var(--buddy-line);
    }

    .buddy[data-character="lion"] {
      --buddy-main: #ffd43b;
      --buddy-light: #fff3bf;
      --buddy-dark: #ffb703;
      --buddy-accent: #ff922b;
      --buddy-line: #7a4b00;
      --buddy-face: #2b2d42;
    }

    .buddy[data-character="rabbit"] {
      --buddy-main: #f8f0ff;
      --buddy-light: #ffffff;
      --buddy-dark: #e7d8ff;
      --buddy-accent: #ffb3c6;
      --buddy-line: #6b4e71;
      --buddy-face: #3b2f4a;
    }
    .buddy[data-character="rabbit"] .buddy-ear {
      height: 74px;
      width: 28px;
      border-radius: 999px;
      top: -16px;
    }
    .buddy[data-character="rabbit"] .buddy-ear.left { left: 32px; transform: rotate(-8deg); }
    .buddy[data-character="rabbit"] .buddy-ear.right { right: 32px; transform: rotate(8deg); }

    .buddy[data-character="cat"] {
      --buddy-main: #ffe8cc;
      --buddy-light: #fff4e6;
      --buddy-dark: #ffc078;
      --buddy-accent: #ff922b;
      --buddy-line: #7c4a22;
      --buddy-face: #2b2d42;
    }
    .buddy[data-character="cat"] .buddy-ear {
      width: 42px;
      height: 42px;
      border-radius: 10px 70% 10px 70%;
      top: 8px;
    }

    .buddy[data-character="dog"] {
      --buddy-main: #d8b384;
      --buddy-light: #f3d5b5;
      --buddy-dark: #b08968;
      --buddy-accent: #8d5524;
      --buddy-line: #5c3d2e;
      --buddy-face: #2b2d42;
    }
    .buddy[data-character="dog"] .buddy-ear {
      height: 58px;
      width: 34px;
      border-radius: 60% 60% 80% 80%;
      top: 18px;
    }
    .buddy[data-character="dog"] .buddy-ear.left { left: 12px; transform: rotate(-38deg); }
    .buddy[data-character="dog"] .buddy-ear.right { right: 12px; transform: rotate(38deg); }

    .buddy[data-character="panda"] {
      --buddy-main: #f8f9fa;
      --buddy-light: #ffffff;
      --buddy-dark: #dee2e6;
      --buddy-accent: #343a40;
      --buddy-line: #212529;
      --buddy-face: #212529;
    }
    .buddy[data-character="panda"] .buddy-ear,
    .buddy[data-character="panda"] .buddy-arm,
    .buddy[data-character="panda"] .buddy-feet {
      background: #343a40;
    }

    .buddy[data-character="bear"] {
      --buddy-main: #c08457;
      --buddy-light: #e6b98a;
      --buddy-dark: #9c6644;
      --buddy-accent: #7f5539;
      --buddy-line: #5c3d2e;
      --buddy-face: #2b2d42;
    }
    .buddy[data-character="bear"] .buddy-ear {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      top: 22px;
    }

    .buddy[data-character="fox"] {
      --buddy-main: #ff922b;
      --buddy-light: #ffd8a8;
      --buddy-dark: #f76707;
      --buddy-accent: #fff4e6;
      --buddy-line: #7c2d12;
      --buddy-face: #2b2d42;
    }
    .buddy[data-character="fox"] .buddy-ear {
      width: 42px;
      height: 48px;
      border-radius: 10px 70% 10px 70%;
      top: 4px;
    }

    .buddy[data-character="penguin"] {
      --buddy-main: #343a40;
      --buddy-light: #f8f9fa;
      --buddy-dark: #212529;
      --buddy-accent: #ffd43b;
      --buddy-line: #111;
      --buddy-face: #111;
    }
    .buddy[data-character="penguin"] .buddy-ear {
      display: none;
    }
    .buddy[data-character="penguin"] .buddy-body {
      border-radius: 50% 50% 42% 42%;
    }

    .buddy[data-character="frog"] {
      --buddy-main: #8ce99a;
      --buddy-light: #d3f9d8;
      --buddy-dark: #51cf66;
      --buddy-accent: #40c057;
      --buddy-line: #2b8a3e;
      --buddy-face: #1b4332;
    }
    .buddy[data-character="frog"] .buddy-ear {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      top: 14px;
    }

    .buddy[data-character="robot"] {
      --buddy-main: #adb5bd;
      --buddy-light: #e9ecef;
      --buddy-dark: #868e96;
      --buddy-accent: #74c0fc;
      --buddy-line: #343a40;
      --buddy-face: #1864ab;
    }
    .buddy[data-character="robot"] .buddy-head {
      border-radius: 24px;
    }
    .buddy[data-character="robot"] .buddy-ear {
      width: 18px;
      height: 38px;
      border-radius: 8px;
      top: 42px;
    }
    .buddy[data-character="robot"] .buddy-ear.left { left: 6px; transform: rotate(0); }
    .buddy[data-character="robot"] .buddy-ear.right { right: 6px; transform: rotate(0); }

    .buddy.front .buddy-eye {
      top: 45px;
    }

    .buddy.front .buddy-mouth {
      left: 52px;
      top: 68px;
      width: 28px;
      height: 16px;
      border-bottom: 5px solid var(--buddy-face);
      border-top: 0;
      background: transparent;
      border-radius: 0 0 40px 40px;
    }

    .buddy.happy .buddy-eye {
      height: 6px;
      top: 53px;
      border-radius: 999px;
    }

    .buddy.sad .buddy-eye.left {
      transform: rotate(-12deg);
    }

    .buddy.sad .buddy-eye.right {
      transform: rotate(12deg);
    }

    .buddy.sad .buddy-mouth {
      top: 80px;
      width: 30px;
      height: 16px;
      border-top: 5px solid var(--buddy-face);
      border-bottom: 0;
      background: transparent;
      border-radius: 40px 40px 0 0;
    }

    .buddy.thinking .buddy-mouth {
      border-bottom-color: var(--buddy-face);
      background: transparent;
    }

    .score-pop {
      position: fixed;
      right: clamp(130px, 16vw, 230px);
      bottom: clamp(145px, 22vw, 250px);
      z-index: 30;
      font-size: 34px;
      font-weight: 1000;
      pointer-events: none;
      animation: scorePop 0.9s ease forwards;
      text-shadow: 0 3px 0 rgba(255,255,255,0.75);
    }

    .score-pop.good { color: #2f9e44; }
    .score-pop.bad { color: #e03131; }

    @keyframes scorePop {
      0% { transform: translateY(18px) scale(0.7); opacity: 0; }
      18% { opacity: 1; }
      100% { transform: translateY(-48px) scale(1.2); opacity: 0; }
    }


    /* ===== v5 front-facing animal characters ===== */
    .buddy-stage {
      position: absolute;
      right: 0;
      bottom: 0;
      width: 178px;
      height: 198px;
      filter: drop-shadow(0 12px 12px rgba(0,0,0,0.16));
      transform-origin: bottom center;
    }

    .buddy-stage .buddy-svg {
      width: 100%;
      height: 100%;
      display: block;
      animation: buddyIdle 2.4s ease-in-out infinite;
    }

    .buddy-stage.happy .buddy-svg {

  <script>
    const wordBank = [
      { id: "blanket", en: "blanket", kk: "[ˋblæŋkɪt]", zh: "毯子", bopomo: "ㄊㄢˇ ㄗ˙" },

      { id: "important", en: "important", kk: "[ɪmˋpɔrtṇt]", zh: "重要的", bopomo: "ㄓㄨㄥˋ ㄧㄠˋ ㄉㄜ˙" },
      { id: "alone", en: "alone", kk: "[əˋlon]", zh: "獨自；單獨", bopomo: "ㄉㄨˊ ㄗˋ；ㄉㄢ ㄉㄨˊ" },
      { id: "grow", en: "grow", kk: "[gro]", zh: "成長；種植", bopomo: "ㄔㄥˊ ㄓㄤˇ；ㄓㄨㄥˋ ㄓˊ" },
      { id: "sniff", en: "sniff", kk: "[snɪf]", zh: "聞一聞；嗅", bopomo: "ㄨㄣˊ ㄧˋ ㄨㄣˊ；ㄒㄧㄡˋ" },

      { id: "send", en: "send", kk: "[sɛnd]", zh: "寄送；傳送", bopomo: "ㄐㄧˋ ㄙㄨㄥˋ；ㄔㄨㄢˊ ㄙㄨㄥˋ" },
      { id: "skip", en: "skip", kk: "[skɪp]", zh: "跳過；蹦跳", bopomo: "ㄊㄧㄠˋ ㄍㄨㄛˋ；ㄅㄥˋ ㄊㄧㄠˋ" },
      { id: "stream", en: "stream", kk: "[strim]", zh: "小溪；溪流", bopomo: "ㄒㄧㄠˇ ㄒㄧ；ㄒㄧ ㄌㄧㄡˊ" },
      { id: "wonderful", en: "wonderful", kk: "[ˋwʌndɚfəl]", zh: "很棒的", bopomo: "ㄏㄣˇ ㄅㄤˋ ㄉㄜ˙" }
    ];

    const board = document.getElementById("board");
    const matchedEl = document.getElementById("matched");
    const movesEl = document.getElementById("moves");
    const scoreEl = document.getElementById("score");
    const timerEl = document.getElementById("timer");
    const starsEl = document.getElementById("stars");
    const messageEl = document.getElementById("message");
    const difficultyEl = document.getElementById("difficulty");
    const musicToggle = document.getElementById("musicToggle");
    const volumeEl = document.getElementById("volume");
    const musicStyleEl = document.getElementById("musicStyle");
    const peekSecondsEl = document.getElementById("peekSeconds");
    const wrongListEl = document.getElementById("wrongList");
    const rewardEl = document.getElementById("reward");
    const rewardEmojiEl = document.getElementById("rewardEmoji");
    const rewardTextEl = document.getElementById("rewardText");
    const rewardStarsEl = document.getElementById("rewardStars");
    const buddyEl = document.getElementById("buddy");
    const speechEl = document.getElementById("speech");
    const characterSelectEl = document.getElementById("characterSelect");

    let first = null;
    let second = null;
    let lock = false;
    let matched = 0;
    let moves = 0;
    let score = 0;
    let stars = 0;
    let seconds = 0;
    let timer = null;
    let totalPairs = 12;
    const WRONG_KEY = "wordQuestWrongPairIdsV1";
    const LAST_BATCH_KEY = "wordQuestLastBatchIdsV1";

    // --------- Music / Sound Effects: pure WebAudio, no external file needed ---------
    let audioCtx = null;
    let masterGain = null;
    let musicGain = null;
    let sfxGain = null;
    let musicInterval = null;
    let musicEnabled = false;
    let noteIndex = 0;

    const musicThemes = {
      adventure: [
        { note: 392.00, len: 0.18 }, { note: 493.88, len: 0.18 },
        { note: 523.25, len: 0.22 }, { note: 587.33, len: 0.18 },
        { note: 523.25, len: 0.18 }, { note: 493.88, len: 0.22 },
        { note: 440.00, len: 0.18 }, { note: 392.00, len: 0.26 }
      ],
      happy: [
        { note: 523.25, len: 0.14 }, { note: 659.25, len: 0.14 },
        { note: 783.99, len: 0.16 }, { note: 659.25, len: 0.14 },
        { note: 698.46, len: 0.14 }, { note: 880.00, len: 0.18 },
        { note: 783.99, len: 0.14 }, { note: 659.25, len: 0.22 }
      ],
      calm: [
        { note: 329.63, len: 0.26 }, { note: 392.00, len: 0.26 },
        { note: 440.00, len: 0.30 }, { note: 392.00, len: 0.26 },
        { note: 349.23, len: 0.26 }, { note: 392.00, len: 0.30 },
        { note: 329.63, len: 0.26 }, { note: 293.66, len: 0.34 }
      ],
      victory: [
        { note: 523.25, len: 0.12 }, { note: 587.33, len: 0.12 },
        { note: 659.25, len: 0.12 }, { note: 783.99, len: 0.15 },
        { note: 1046.50, len: 0.18 }, { note: 783.99, len: 0.13 },
        { note: 880.00, len: 0.13 }, { note: 1046.50, len: 0.24 }
      ]
    };

    const restartJingles = [
      [392.00, 523.25, 659.25],
      [440.00, 554.37, 659.25],
      [329.63, 493.88, 659.25],
      [523.25, 783.99, 1046.50]
    ];

    function ensureAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioCtx.createGain();
      musicGain = audioCtx.createGain();
      sfxGain = audioCtx.createGain();

      masterGain.gain.value = Number(volumeEl.value) / 100;
      musicGain.gain.value = 0.18;
      sfxGain.gain.value = 0.55;

      musicGain.connect(masterGain);
      sfxGain.connect(masterGain);
      masterGain.connect(audioCtx.destination);
    }

    function playTone(freq, duration = 0.12, type = "sine", destination = sfxGain, startOffset = 0) {
      ensureAudio();
      const now = audioCtx.currentTime + startOffset;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);

      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.8, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      osc.connect(gain);
      gain.connect(destination);

      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function playFlipSound() {
      playTone(520, 0.055, "triangle");
    }

    function playMatchSound() {
      playTone(660, 0.10, "sine", sfxGain, 0);
      playTone(880, 0.12, "sine", sfxGain, 0.08);
      playTone(990, 0.10, "sine", sfxGain, 0.18);
    }

    function playWrongSound() {
      playTone(220, 0.11, "sawtooth", sfxGain, 0);
      playTone(185, 0.12, "sawtooth", sfxGain, 0.10);
    }

    function playWinSound() {
      const notes = [523.25, 659.25, 783.99, 1046.50];
      notes.forEach((n, i) => playTone(n, 0.16, "triangle", sfxGain, i * 0.11));
    }

    function playMusicNote() {
      if (!musicEnabled) return;
      ensureAudio();
      const melody = musicThemes[musicStyleEl.value] || musicThemes.adventure;
      const item = melody[noteIndex % melody.length];
      playTone(item.note, item.len, "triangle", musicGain);
      noteIndex++;
    }

    function startMusic() {
      ensureAudio();
      if (audioCtx.state === "suspended") audioCtx.resume();
      musicEnabled = true;
      musicToggle.textContent = "🔇 關音樂";
      musicToggle.classList.add("music-on");

      if (!musicInterval) {
        playMusicNote();
        musicInterval = setInterval(playMusicNote, 260);
      }
    }

    function stopMusic() {
      musicEnabled = false;
      musicToggle.textContent = "🎵 開音樂";
      musicToggle.classList.remove("music-on");
      clearInterval(musicInterval);
      musicInterval = null;
    }

    musicToggle.addEventListener("click", () => {
      if (musicEnabled) stopMusic();
      else startMusic();
    });

    musicStyleEl.addEventListener("change", () => {
      noteIndex = 0;
      if (musicEnabled) {
        stopMusic();
        startMusic();
      }
    });

    volumeEl.addEventListener("input", () => {
      ensureAudio();
      masterGain.gain.value = Number(volumeEl.value) / 100;
    });


    // --------- Pronunciation: browser SpeechSynthesis ---------
    function speak(text, lang = "en-US") {
      if (!("speechSynthesis" in window)) {
        messageEl.textContent = "這個瀏覽器不支援發音功能，建議用 Chrome 或 Edge。";
        return;
      }
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      utterance.rate = lang.startsWith("en") ? 0.82 : 0.95;
      utterance.pitch = 1.08;
      utterance.volume = Math.min(1, Math.max(0.2, Number(volumeEl.value) / 100 + 0.25));
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(utterance);
    }

    function speakCard(card) {
      const text = card.dataset.speakText;
      const lang = card.dataset.speakLang;
      if (text && lang) speak(text, lang);
    }



    function loadLastBatchIds() {
      try {
        const data = JSON.parse(localStorage.getItem(LAST_BATCH_KEY) || "[]");
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function saveLastBatchIds(ids) {
      localStorage.setItem(LAST_BATCH_KEY, JSON.stringify(ids));
    }

    function loadWrongIds() {
      try {
        const data = JSON.parse(localStorage.getItem(WRONG_KEY) || "[]");
        return Array.isArray(data) ? data : [];
      } catch {
        return [];
      }
    }

    function saveWrongIds(ids) {
      localStorage.setItem(WRONG_KEY, JSON.stringify([...new Set(ids)].slice(0, 12)));
      renderWrongList();
    }

    function recordWrongPair(id) {
      const ids = loadWrongIds();
      const next = [id, ...ids.filter(x => x !== id)];
      saveWrongIds(next);
    }

    function removeWrongPair(id) {
      const ids = loadWrongIds().filter(x => x !== id);
      saveWrongIds(ids);
    }

    function getWordById(id) {
      return wordBank.find(w => w.id === id);
    }

    function renderWrongList() {
      const ids = loadWrongIds();
      wrongListEl.innerHTML = "";
      if (ids.length === 0) {
        wrongListEl.innerHTML = '<span class="wrong-chip">目前沒有錯誤記錄 👍</span>';
        return;
      }
      ids.forEach(id => {
        const item = getWordById(id);
        if (!item) return;
        const chip = document.createElement("span");
        chip.className = "wrong-chip";
        chip.innerHTML = `<strong>${item.en}</strong> / ${item.zh}`;
        wrongListEl.appendChild(chip);
      });
    }

    function showReward(text = "Good Job!", emoji = "⭐", showThreeStars = false) {
      rewardEmojiEl.textContent = emoji;
      rewardTextEl.textContent = text;
      rewardStarsEl.style.display = showThreeStars ? "block" : "none";
      rewardEl.classList.remove("show");
      void rewardEl.offsetWidth;
      rewardEl.classList.add("show");

      const coins = showThreeStars ? ["⭐", "⭐", "⭐", "🏆", "🌟", "✨"] : ["⭐", "✨", "🏆", "💎", "🌟"];
      for (let i = 0; i < 10; i++) {
        const coin = document.createElement("div");
        coin.className = "coin-fly";
        coin.textContent = coins[i % coins.length];
        coin.style.setProperty("--dx", `${Math.round((Math.random() - 0.5) * 360)}px`);
        coin.style.setProperty("--dy", `${Math.round((Math.random() - 0.8) * 300)}px`);
        document.body.appendChild(coin);
        setTimeout(() => coin.remove(), 900);
      }
    }

    function playRestartJingle() {
      ensureAudio();
      const seq = restartJingles[Math.floor(Math.random() * restartJingles.length)];
      seq.forEach((n, i) => playTone(n, 0.12, "triangle", sfxGain, i * 0.10));
    }

      const pop = document.createElement("div");
      pop.className = `score-pop ${type}`;
      pop.textContent = text;
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 950);

    function renderBuddy(character, mood) {
      buddyEl.innerHTML = getCharacterSVG(character, mood);
      buddyEl.dataset.character = character;
      buddyEl.className = `buddy-stage ${mood}`;
    }

    function setBuddyMood(mood, text) {
      const character = buddyEl.dataset.character || "lion";
      renderBuddy(character, mood);
      speechEl.textContent = text;

      if (mood !== "thinking") {
        setTimeout(() => {
          renderBuddy(character, "thinking");
          speechEl.textContent = "再試一次！";
        }, 1200);
      }
    }

    function setCharacter(character) {
      localStorage.setItem("wordQuestCharacterV1", character);
      renderBuddy(character, "thinking");
      speechEl.textContent = "我準備好了！";
    }

    characterSelectEl.addEventListener("change", () => {
      setCharacter(characterSelectEl.value);
    });

    function loadCharacter() {
      const saved = localStorage.getItem("wordQuestCharacterV1") || "lion";
      characterSelectEl.value = saved;
      setCharacter(saved);
    }

    // --------- Game Logic ---------
    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function buildCards(pairCount) {
      const wrongIds = shuffle(loadWrongIds());
      const lastBatchIds = loadLastBatchIds();

      // 只保留少量錯誤單字優先重現，其他位置盡量換新單字
      const wrongWords = wrongIds.map(getWordById).filter(Boolean).slice(0, Math.min(2, pairCount));
      const wrongSet = new Set(wrongWords.map(w => w.id));

      const freshPool = wordBank.filter(w => !wrongSet.has(w.id) && !lastBatchIds.includes(w.id));
      const fallbackPool = wordBank.filter(w => !wrongSet.has(w.id));

      let fillWords = shuffle(freshPool).slice(0, Math.max(0, pairCount - wrongWords.length));
      if (fillWords.length < pairCount - wrongWords.length) {
        const used = new Set(fillWords.map(w => w.id));
        const more = shuffle(fallbackPool.filter(w => !used.has(w.id))).slice(0, (pairCount - wrongWords.length) - fillWords.length);
        fillWords = [...fillWords, ...more];
      }

      const selected = shuffle([...wrongWords, ...fillWords]).slice(0, pairCount);
      saveLastBatchIds(selected.map(w => w.id));
      const cards = [];
      selected.forEach(item => {
        cards.push({
          pairId: item.id,
          type: "english",
          label: "English / KK",
          text: item.en,
          phonetic: item.kk,
          speakText: item.en,
          speakLang: "en-US"
        });
        cards.push({
          pairId: item.id,
          type: "chinese",
          label: "中文 / 注音",
          text: item.zh,
          phonetic: item.bopomo,
          speakText: item.zh.replace("；", "，"),
          speakLang: "zh-TW"
        });
      });
      return shuffle(cards);
    }

    function render() {
      totalPairs = Number(difficultyEl.value);
      const cards = buildCards(totalPairs);
      board.innerHTML = "";

      cards.forEach((card, index) => {
        const btn = document.createElement("button");
        btn.className = `card ${card.type}`;
        btn.dataset.pairId = card.pairId;
        btn.dataset.type = card.type;
        btn.dataset.index = index;
        btn.dataset.speakText = card.speakText;
        btn.dataset.speakLang = card.speakLang;
        btn.setAttribute("aria-label", "hidden card");

        btn.innerHTML = `
          <span class="card-inner">
            <span class="face back">?</span>
            <span class="face front">
              <span class="card-type">${card.label}</span>
              <span class="word">${card.text}</span>
              <span class="phonetic">${card.phonetic || ""}</span>
              <span class="speak-hint">🔊</span>
            </span>
          </span>
        `;

        btn.addEventListener("click", () => flip(btn));
        board.appendChild(btn);
      });
    }

    function startTimer() {
      if (timer) return;
      timer = setInterval(() => {
        seconds++;
        timerEl.textContent = seconds;
      }, 1000);
    }

    function resetStats() {
      first = null;
      second = null;
      lock = false;
      matched = 0;
      moves = 0;
      score = 0;
      stars = 0;
      seconds = 0;
      clearInterval(timer);
      timer = null;

      matchedEl.textContent = "0";
      movesEl.textContent = "0";
      scoreEl.textContent = "0";
      starsEl.textContent = "0";
      timerEl.textContent = "0";
      messageEl.textContent = "翻一張英文，再找它的中文！";
      if (typeof setBuddyMood === "function") {
        buddyEl.classList.remove("happy", "sad");
        buddyEl.classList.add("thinking");
        speechEl.textContent = "我正面看著你喔！";
      }
    }

    function flip(card) {
      if (lock || card.classList.contains("flipped") || card.classList.contains("matched")) return;

      ensureAudio();
      if (audioCtx.state === "suspended") audioCtx.resume();

      playFlipSound();
      speakCard(card);
      startTimer();
      card.classList.add("flipped");

      if (!first) {
        first = card;
        messageEl.textContent = "再翻一張，看看能不能配對！";
        return;
      }

      second = card;
      moves++;
      movesEl.textContent = moves;
      checkMatch();
    }

    function checkMatch() {
      lock = true;
      const samePair = first.dataset.pairId === second.dataset.pairId;
      const differentType = first.dataset.type !== second.dataset.type;

      if (samePair && differentType) {
        playMatchSound();
        showReward("+10 分！", "🏆", false);
        showScorePop("+10", "good");
        setBuddyMood("happy", "太棒了！+10");

        first.classList.add("matched");
        second.classList.add("matched");
        matched++;
        score += 10;
        removeWrongPair(first.dataset.pairId);
        updateStats();

        messageEl.textContent = "答對了！聽發音，看 KK 音標，再請孩子念一次英文。";
        clearPick();

        if (matched === totalPairs) {
          clearInterval(timer);
          const bonus = Math.max(0, 60 - seconds);
          score += bonus;
          stars = 3;
          updateStats();
          playWinSound();
          showReward("完美過關！", "🏆", true);
          setBuddyMood("happy", "全對了！送你 3 顆星星！");
          messageEl.textContent = `全部答對！獲得 3 顆星星，時間獎勵 +${bonus} 分。總分 ${score} 分！`;
        }
      } else {
        playWrongSound();
        showScorePop("-5", "bad");
        setBuddyMood("sad", "扣 5 分，下次會再練！");
        recordWrongPair(first.dataset.pairId);
        recordWrongPair(second.dataset.pairId);

        score = Math.max(0, score - 5);
        updateStats();
        messageEl.textContent = "翻兩張沒有配對成功，扣 5 分。小夥伴正在幫你記住這組！";

        first.classList.add("wrong");
        second.classList.add("wrong");

        setTimeout(() => {
          first.classList.remove("flipped", "wrong");
          second.classList.remove("flipped", "wrong");
          clearPick();
        }, 850);
      }
    }

    function clearPick() {
      first = null;
      second = null;
      lock = false;
    }

    function updateStats() {
      matchedEl.textContent = matched;
      scoreEl.textContent = score;
      starsEl.textContent = stars;
    }

    function restart() {
      resetStats();
      playRestartJingle();

      // 重新開始時自動換一種背景音樂，讓每輪感覺不同。
      const styles = [...musicStyleEl.options].map(opt => opt.value);
      const current = musicStyleEl.value;
      const candidates = styles.filter(s => s !== current);
      musicStyleEl.value = candidates[Math.floor(Math.random() * candidates.length)];
      noteIndex = 0;
      if (musicEnabled) {
        stopMusic();
        startMusic();
      }

      render();
    }

    document.getElementById("restart").addEventListener("click", restart);
    document.getElementById("shuffleWords").addEventListener("click", restart);
    difficultyEl.addEventListener("change", restart);

    document.getElementById("peek").addEventListener("click", () => {
      if (lock) return;
      ensureAudio();
      if (audioCtx.state === "suspended") audioCtx.resume();
      startTimer();
      lock = true;
      const cards = [...document.querySelectorAll(".card:not(.matched)")];
      cards.forEach(card => card.classList.add("flipped"));
      const peekSeconds = Number(peekSecondsEl.value);
      messageEl.textContent = `偷看中：${peekSeconds} 秒，記住位置！`;
      setTimeout(() => {
        cards.forEach(card => card.classList.remove("flipped"));
        first = null;
        second = null;
        lock = false;
        messageEl.textContent = "開始配對！";
      }, Number(peekSecondsEl.value) * 1000);
    });

    loadCharacter();
    restart();
    renderWrongList();
  </script>
