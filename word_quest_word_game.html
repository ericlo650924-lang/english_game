<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Quest Quiz - 英選中 / 中選英 5 選 1</title>
  <style>
    :root {
      --bg: #f5efe1;
      --panel: #fffaf0;
      --text: #263238;
      --muted: #6b7280;
      --main: #4dabf7;
      --main-dark: #1971c2;
      --ok: #2f9e44;
      --bad: #e03131;
      --warn: #f59f00;
      --border: #e3d5b8;
      --shadow: 0 12px 28px rgba(35, 30, 20, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Comic Sans MS", "Noto Sans TC", system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 8%, #dff4ff 0, transparent 30%),
        radial-gradient(circle at 88% 88%, #ffe8cc 0, transparent 34%),
        var(--bg);
    }

    .app {
      max-width: 1080px;
      margin: 0 auto;
      padding: 22px;
    }

    header {
      display: flex;
      gap: 14px;
      justify-content: space-between;
      align-items: stretch;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .title, .scoreboard, .game-card, .control-panel, .wrong-panel {
      background: rgba(255, 250, 240, 0.94);
      border: 2px solid var(--border);
      border-radius: 24px;
      box-shadow: var(--shadow);
    }

    .title {
      padding: 16px 20px;
      flex: 1;
      min-width: 280px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-weight: 800;
    }

    .scoreboard {
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(5, minmax(74px, 1fr));
      gap: 8px;
      min-width: min(100%, 500px);
    }

    .stat {
      background: #fff;
      border: 2px solid #eadfcb;
      border-radius: 18px;
      padding: 9px 8px;
      text-align: center;
    }

    .stat .label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .stat .value {
      font-size: 23px;
      font-weight: 1000;
    }

    .control-panel {
      padding: 12px;
      margin-bottom: 16px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    button, select {
      font-family: inherit;
      font-size: 16px;
      border-radius: 16px;
      border: 2px solid #b8a981;
      padding: 10px 14px;
      cursor: pointer;
      background: #fff;
    }

    input[type="range"] {
      width: 130px;
      accent-color: var(--main-dark);
      cursor: pointer;
    }

    .volume-box {
      display: flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 2px solid #eadfcb;
      border-radius: 16px;
      padding: 8px 12px;
      font-weight: 900;
    }

    .volume-value {
      min-width: 42px;
      color: var(--muted);
      text-align: right;
      font-size: 14px;
    }

    button {
      background: #ffe08a;
      font-weight: 1000;
      transition: transform 0.12s ease, filter 0.12s ease;
    }

    button:hover { filter: brightness(1.04); }
    button:active { transform: scale(0.98); }
    button:disabled {
      opacity: 0.58;
      cursor: not-allowed;
    }

    .game-card {
      position: relative;
      overflow: hidden;
      min-height: 540px;
      padding: clamp(18px, 3vw, 30px);
    }

    .question-area {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 220px;
      gap: 18px;
      align-items: center;
    }

    .word-box {
      background: linear-gradient(135deg, #e7f5ff, #ffffff);
      border: 3px solid #a5d8ff;
      border-radius: 28px;
      padding: clamp(18px, 3vw, 32px);
      text-align: center;
      min-height: 190px;
      display: grid;
      place-items: center;
    }

    .prompt-label {
      color: var(--muted);
      font-size: 16px;
      font-weight: 900;
      margin-bottom: 8px;
    }

    .word {
      font-size: clamp(44px, 8vw, 82px);
      font-weight: 1000;
      color: #0b7285;
      line-height: 1;
      letter-spacing: 0.5px;
    }

    .kk {
      font-size: clamp(20px, 3vw, 30px);
      color: #495057;
      font-weight: 900;
      margin-top: 14px;
    }

    .speak-row {
      margin-top: 16px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .speaker {
      background: #d3f9d8;
      border-color: #69db7c;
    }

    .options {
      margin-top: 24px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 12px;
    }

    .option {
      min-height: 92px;
      background: #fff;
      border: 3px solid #dee2e6;
      border-radius: 22px;
      font-size: clamp(17px, 2vw, 23px);
      font-weight: 1000;
      color: var(--text);
      display: grid;
      place-items: center;
      text-align: center;
      padding: 12px;
      transition: transform 0.12s ease, background 0.12s ease, border 0.12s ease;
    }

    .option:hover {
      transform: translateY(-3px);
      border-color: var(--main);
    }

    .option.correct {
      background: #d3f9d8;
      border-color: var(--ok);
      color: #1b5e20;
      animation: goodPulse 0.5s ease;
    }

    .option.wrong {
      background: #ffe3e3;
      border-color: var(--bad);
      color: #8a1c1c;
      animation: shake 0.36s ease;
    }

    .option.reveal {
      background: #d3f9d8;
      border-color: var(--ok);
    }

    @keyframes goodPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }

    .message {
      margin-top: 18px;
      min-height: 34px;
      font-size: 22px;
      font-weight: 1000;
      text-align: center;
    }

    .progress {
      margin-top: 16px;
      height: 18px;
      border-radius: 999px;
      background: #e9ecef;
      overflow: hidden;
      border: 2px solid #ced4da;
    }

    .bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #74c0fc, #69db7c);
      transition: width 0.25s ease;
    }

    .buddy-wrap {
      position: relative;
      min-height: 230px;
      display: grid;
      place-items: center;
    }

    .speech {
      position: absolute;
      top: 0;
      right: 8px;
      background: #fff;
      border: 3px solid #7c4a22;
      border-radius: 20px;
      padding: 10px 12px;
      font-weight: 1000;
      text-align: center;
      box-shadow: var(--shadow);
      max-width: 180px;
      z-index: 2;
    }

    .buddy-stage {
      width: 180px;
      height: 200px;
      margin-top: 34px;
      filter: drop-shadow(0 12px 12px rgba(0,0,0,0.16));
      transform-origin: bottom center;
    }

    .buddy-stage .buddy-svg {
      width: 100%;
      height: 100%;
      display: block;
      animation: idle 2.4s ease-in-out infinite;
    }

    .buddy-stage.happy .buddy-svg {
      animation: jump 0.7s ease, idle 2.4s ease-in-out 0.7s infinite;
    }

    .buddy-stage.sad .buddy-svg {
      animation: buddyShake 0.5s ease;
    }

    @keyframes idle {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-7px) rotate(1deg); }
    }

    @keyframes jump {
      0%, 100% { transform: translateY(0) scale(1); }
      40% { transform: translateY(-32px) scale(1.06); }
    }

    @keyframes buddyShake {
      0%, 100% { transform: translateX(0); }
      20% { transform: translateX(-9px) rotate(-2deg); }
      40% { transform: translateX(9px) rotate(2deg); }
      60% { transform: translateX(-7px) rotate(-2deg); }
      80% { transform: translateX(7px) rotate(2deg); }
    }

    .reward {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      pointer-events: none;
      z-index: 50;
      animation: fade 1.1s ease forwards;
    }

    .reward.show { display: grid; }

    .reward-card {
      background: rgba(255, 250, 240, 0.98);
      border: 5px solid #ffd43b;
      border-radius: 30px;
      padding: 26px 34px;
      text-align: center;
      box-shadow: 0 18px 42px rgba(0,0,0,0.2);
      animation: pop 0.55s ease forwards;
    }

    .reward-emoji {
      font-size: 58px;
      line-height: 1;
    }

    .reward-text {
      margin-top: 8px;
      font-size: 32px;
      font-weight: 1000;
    }

    .reward-stars {
      display: none;
      margin-top: 8px;
      font-size: 44px;
      color: #f59f00;
      letter-spacing: 8px;
    }

    @keyframes fade {
      0% { opacity: 0; }
      15% { opacity: 1; }
      82% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes pop {
      0% { transform: scale(0.7) rotate(-4deg); }
      60% { transform: scale(1.08) rotate(2deg); }
      100% { transform: scale(1); }
    }

    .score-pop {
      position: fixed;
      left: 50%;
      top: 35%;
      transform: translate(-50%, -50%);
      z-index: 60;
      font-size: 44px;
      font-weight: 1000;
      pointer-events: none;
      animation: scorePop 0.9s ease forwards;
      text-shadow: 0 3px 0 rgba(255,255,255,0.75);
    }

    .score-pop.good { color: var(--ok); }
    .score-pop.bad { color: var(--bad); }

    @keyframes scorePop {
      0% { transform: translate(-50%, -20%) scale(0.7); opacity: 0; }
      18% { opacity: 1; }
      100% { transform: translate(-50%, -110%) scale(1.2); opacity: 0; }
    }

    .wrong-panel {
      margin-top: 16px;
      padding: 14px 16px;
    }

    .wrong-panel h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .wrong-panel p {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 14px;
    }

    .wrong-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .wrong-chip {
      border: 2px solid #ffc9c9;
      background: #fff5f5;
      border-radius: 999px;
      padding: 7px 10px;
      font-weight: 900;
      font-size: 14px;
    }

    .wrong-chip strong { color: #c92a2a; }

    .footer {
      margin-top: 18px;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
      font-weight: 800;
    }

    @media (max-width: 860px) {
      .scoreboard { grid-template-columns: repeat(3, 1fr); }
      .question-area { grid-template-columns: 1fr; }
      .buddy-wrap { min-height: 170px; }
      .buddy-stage { width: 130px; height: 145px; }
      .speech { right: auto; top: -4px; }
      .options { grid-template-columns: 1fr; }
      .option { min-height: 66px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <section class="title">
        <h1>Word Quest Quiz 🎯</h1>
        <p class="subtitle">新玩法：英選中 / 中選英可切換；答對停留時間可調；錯 1 次就記錄</p>
      </section>

      <section class="scoreboard">
        <div class="stat"><span class="label">題目</span><span id="round" class="value">0/10</span></div>
        <div class="stat"><span class="label">答對</span><span id="correct" class="value">0</span></div>
        <div class="stat"><span class="label">分數</span><span id="score" class="value">0</span></div>
        <div class="stat"><span class="label">錯誤</span><span id="wrongAttempts" class="value">0/3</span></div>
        <div class="stat"><span class="label">星星</span><span id="stars" class="value">0</span></div>
      </section>
    </header>

    <section class="control-panel">
      <label>
        題數：
        <select id="roundCount">
          <option value="6">6 題</option>
          <option value="10" selected>10 題</option>
          <option value="15">15 題</option>
        </select>
      </label>
      <label>
        出題模式：
        <select id="quizMode">
          <option value="en_to_zh" selected>英選中</option>
          <option value="zh_to_en">中選英</option>
        </select>
      </label>
      <label>
        答對停留：
        <select id="autoNextDelay">
          <option value="1200">1.2 秒</option>
          <option value="1800" selected>1.8 秒</option>
          <option value="2500">2.5 秒</option>
          <option value="3500">3.5 秒</option>
        </select>
      </label>
      <label>
        角色：
        <select id="characterSelect">
          <option value="lion" selected>小獅子</option>
          <option value="rabbit">兔兔</option>
          <option value="cat">小貓</option>
          <option value="dog">小狗</option>
          <option value="panda">熊貓</option>
          <option value="bear">小熊</option>
          <option value="fox">狐狸</option>
          <option value="penguin">企鵝</option>
          <option value="frog">青蛙</option>
          <option value="robot">機器人</option>
        </select>
      </label>
      <div class="volume-box">
        音量
        <input id="volume" type="range" min="0" max="100" value="55" />
        <span id="volumeValue" class="volume-value">55%</span>
      </div>
      <label>
        背景音樂：
        <select id="musicStyle">
          <option value="off">關閉</option>
          <option value="adventure" selected>冒險</option>
          <option value="happy">快樂</option>
          <option value="calm">輕鬆</option>
          <option value="victory">勝利</option>
        </select>
      </label>
      <button id="musicToggle">🎵 開音樂</button>
      <button id="newGame">開始新遊戲 / 隨機換單字</button>
      <button id="speakBtn">🔊 唸題目</button>
      <button id="nextBtn" disabled>下一題</button>
    </section>

    <section class="game-card">
      <div class="question-area">
        <div>
          <div class="word-box">
            <div>
              <div class="prompt-label">這個英文是什麼意思？</div>
              <div id="word" class="word">word</div>
              <div id="kk" class="kk">[kk]</div>
              <div class="speak-row">
                <button id="speakBtn2" class="speaker">🔊 再聽一次</button>
              </div>
            </div>
          </div>

          <div id="options" class="options"></div>
          <div id="message" class="message">選一個中文答案！</div>
          <div class="progress"><div id="bar" class="bar"></div></div>
        </div>

        <div class="buddy-wrap">
          <div id="speech" class="speech">我幫你加油！</div>
          <div id="buddy" class="buddy-stage thinking" data-character="lion"></div>
        </div>
      </div>
    </section>

    <section class="wrong-panel">
      <h2>錯誤記錄 / 下次優先重現</h2>
      <p>答錯 1 次就會記錄該單字，下次遊戲會優先出現；錯誤累積 3 次才扣分。</p>
      <div id="wrongList" class="wrong-list"></div>
    </section>

    <div id="reward" class="reward">
      <div class="reward-card">
        <div id="rewardEmoji" class="reward-emoji">⭐</div>
        <div id="rewardText" class="reward-text">Good Job!</div>
        <div id="rewardStars" class="reward-stars">★★★</div>
      </div>
    </div>

    <p class="footer">
      規則：可選英選中或中選英；答對 +10，停留一段時間後自動跳下一題；答錯 1 次就保存錯誤單字；錯誤累積 3 次才扣 -5；每次重新開始會隨機換單字；背景音樂與音量可調。全部答對會得到 3 顆星星。
    </p>
  </main>

  <script src="./word_quest_word_bank.js"></script>
  <script>
    const wordBank = window.WORD_QUEST_WORD_BANK || [];

    const roundEl = document.getElementById("round");
    const correctEl = document.getElementById("correct");
    const scoreEl = document.getElementById("score");
    const wrongAttemptsEl = document.getElementById("wrongAttempts");
    const starsEl = document.getElementById("stars");
    const wordEl = document.getElementById("word");
    const kkEl = document.getElementById("kk");
    const optionsEl = document.getElementById("options");
    const messageEl = document.getElementById("message");
    const barEl = document.getElementById("bar");
    const roundCountEl = document.getElementById("roundCount");
    const quizModeEl = document.getElementById("quizMode");
    const autoNextDelayEl = document.getElementById("autoNextDelay");
    const characterSelectEl = document.getElementById("characterSelect");
    const nextBtn = document.getElementById("nextBtn");
    const volumeEl = document.getElementById("volume");
    const volumeValueEl = document.getElementById("volumeValue");
    const musicStyleEl = document.getElementById("musicStyle");
    const musicToggleEl = document.getElementById("musicToggle");
    const buddyEl = document.getElementById("buddy");
    const speechEl = document.getElementById("speech");
    const rewardEl = document.getElementById("reward");
    const rewardEmojiEl = document.getElementById("rewardEmoji");
    const rewardTextEl = document.getElementById("rewardText");
    const rewardStarsEl = document.getElementById("rewardStars");

    const WRONG_KEY = "wordQuestQuizWrongIdsV1";
    const CHARACTER_KEY = "wordQuestQuizCharacterV1";
    const VOLUME_KEY = "wordQuestQuizVolumeV1";
    const MUSIC_KEY = "wordQuestQuizMusicStyleV1";
    const LAST_DECK_KEY = "wordQuestQuizLastDeckIdsV1";
    const QUIZ_MODE_KEY = "wordQuestQuizModeV1";
    const AUTO_NEXT_DELAY_KEY = "wordQuestQuizAutoNextDelayV1";

    let deck = [];
    let current = null;
    let currentIndex = 0;
    let correctCount = 0;
    let score = 0;
    let stars = 0;
    let wrongAttempts = 0;
    let answered = false;
    let musicGain = null;
    let musicInterval = null;
    let musicEnabled = false;
    let musicNoteIndex = 0;

    // ----- Sound -----
    let audioCtx = null;
    let sfxGain = null;

    function ensureAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      sfxGain = audioCtx.createGain();
      musicGain = audioCtx.createGain();
      sfxGain.gain.value = getVolume();
      musicGain.gain.value = getVolume() * 0.22;
      sfxGain.connect(audioCtx.destination);
      musicGain.connect(audioCtx.destination);
    }

    function getVolume() {
      return Math.max(0, Math.min(1, Number(volumeEl.value) / 100));
    }

    function updateVolumeUI() {
      const value = Number(volumeEl.value);
      volumeValueEl.textContent = `${value}%`;
      localStorage.setItem(VOLUME_KEY, String(value));
      if (sfxGain) sfxGain.gain.value = getVolume();
      if (musicGain) musicGain.gain.value = getVolume() * 0.22;
    }

    function loadVolume() {
      const saved = localStorage.getItem(VOLUME_KEY);
      if (saved !== null && !Number.isNaN(Number(saved))) {
        volumeEl.value = Math.max(0, Math.min(100, Number(saved)));
      }
      updateVolumeUI();
    }


    const musicThemes = {
      adventure: [
        { note: 392.00, len: 0.18 }, { note: 493.88, len: 0.18 },
        { note: 523.25, len: 0.22 }, { note: 587.33, len: 0.18 },
        { note: 523.25, len: 0.18 }, { note: 493.88, len: 0.22 },
        { note: 440.00, len: 0.18 }, { note: 392.00, len: 0.26 }
      ],
      happy: [
        { note: 523.25, len: 0.14 }, { note: 659.25, len: 0.14 },
        { note: 783.99, len: 0.16 }, { note: 659.25, len: 0.14 },
        { note: 698.46, len: 0.14 }, { note: 880.00, len: 0.18 },
        { note: 783.99, len: 0.14 }, { note: 659.25, len: 0.22 }
      ],
      calm: [
        { note: 329.63, len: 0.26 }, { note: 392.00, len: 0.26 },
        { note: 440.00, len: 0.30 }, { note: 392.00, len: 0.26 },
        { note: 349.23, len: 0.26 }, { note: 392.00, len: 0.30 },
        { note: 329.63, len: 0.26 }, { note: 293.66, len: 0.34 }
      ],
      victory: [
        { note: 523.25, len: 0.12 }, { note: 587.33, len: 0.12 },
        { note: 659.25, len: 0.12 }, { note: 783.99, len: 0.15 },
        { note: 1046.50, len: 0.18 }, { note: 783.99, len: 0.13 },
        { note: 880.00, len: 0.13 }, { note: 1046.50, len: 0.24 }
      ]
    };

    function playMusicTone(freq, duration = 0.18) {
      ensureAudio();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "triangle";
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.7, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain);
      gain.connect(musicGain);
      osc.start(now);
      osc.stop(now + duration + 0.03);
    }

    function playMusicNote() {
      if (!musicEnabled) return;
      const style = musicStyleEl.value;
      if (style === "off") return;
      const theme = musicThemes[style] || musicThemes.adventure;
      const item = theme[musicNoteIndex % theme.length];
      playMusicTone(item.note, item.len);
      musicNoteIndex++;
    }

    function startMusic() {
      ensureAudio();
      if (audioCtx.state === "suspended") audioCtx.resume();
      if (musicStyleEl.value === "off") {
        musicStyleEl.value = "adventure";
      }
      musicEnabled = true;
      musicToggleEl.textContent = "🔇 關音樂";
      localStorage.setItem(MUSIC_KEY, musicStyleEl.value);
      if (!musicInterval) {
        playMusicNote();
        musicInterval = setInterval(playMusicNote, 260);
      }
    }

    function stopMusic() {

      if (musicEnabled) {

      }
    }

    function playTone(freq, duration = 0.12, type = "sine", delay = 0) {
      ensureAudio();
      const now = audioCtx.currentTime + delay;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.8, now + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      osc.connect(gain);
      gain.connect(sfxGain);
      osc.start(now);
      osc.stop(now + duration + 0.02);
    }

    function playCorrect() {
      playTone(660, 0.1, "triangle", 0);
      playTone(880, 0.12, "triangle", 0.08);
      playTone(1046, 0.15, "triangle", 0.18);
    }

    function playWrong() {
      playTone(240, 0.12, "sawtooth", 0);
      playTone(190, 0.14, "sawtooth", 0.1);
    }

    function playWin() {
      [523, 659, 784, 1046].forEach((n, i) => playTone(n, 0.16, "triangle", i * 0.12));
    }

      if (!current) return;
      if (!("speechSynthesis" in window)) {
        messageEl.textContent = "這個瀏覽器不支援發音，建議使用 Chrome 或 Edge。";
        return;
      }

      const mode = quizModeEl.value;
      const text = mode === "zh_to_en" ? current.zh.replace("；", "，") : current.en;
      const u = new SpeechSynthesisUtterance(text);
      u.lang = mode === "zh_to_en" ? "zh-TW" : "en-US";
      u.rate = mode === "zh_to_en" ? 0.95 : 0.82;
      u.pitch = 1.08;
      u.volume = getVolume();
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
    }

    function shuffle(array) {
      const copy = [...array];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    // ----- Game -----
    function buildDeck() {
      const count = Number(roundCountEl.value);
      const lastDeckIds = loadLastDeckIds();

      // 錯誤單字仍優先，但最多 3 個；其餘盡量避開上一局，讓每次重新開始都有新單字。
      const wrongWords = shuffle(loadWrongIds().map(getWordById).filter(Boolean)).slice(0, Math.min(3, count));
      const wrongSet = new Set(wrongWords.map(w => w.id));

      const freshPool = wordBank.filter(w => !wrongSet.has(w.id) && !lastDeckIds.includes(w.id));
      const fallbackPool = wordBank.filter(w => !wrongSet.has(w.id));

      let fresh = shuffle(freshPool).slice(0, count - wrongWords.length);
      if (fresh.length < count - wrongWords.length) {
        const used = new Set(fresh.map(w => w.id));
        const more = shuffle(fallbackPool.filter(w => !used.has(w.id))).slice(0, (count - wrongWords.length) - fresh.length);
        fresh = [...fresh, ...more];
      }

      const nextDeck = shuffle([...wrongWords, ...fresh]).slice(0, count);
      saveLastDeckIds(nextDeck.map(w => w.id));
      return nextDeck;
    }

    function buildOptions(answer) {
      const distractors = shuffle(wordBank.filter(w => w.id !== answer.id)).slice(0, 4);
      return shuffle([answer, ...distractors]);
    }

    function optionText(item) {
      return quizModeEl.value === "zh_to_en" ? item.en : item.zh;
    }

    function questionMainText(item) {
      return quizModeEl.value === "zh_to_en" ? item.zh : item.en;
    }

    function questionSubText(item) {
      return quizModeEl.value === "zh_to_en" ? "選出對應英文" : (item.kk || "");
    }

    function promptText() {
      return quizModeEl.value === "zh_to_en"
        ? "這個中文是哪一個英文？"
        : "這個英文是什麼意思？";
    }

    function updateStats() {
      const total = deck.length || Number(roundCountEl.value);
      const solvedCount = deck.length
        ? Math.min(currentIndex + (answered ? 1 : 0), total)
        : 0;

      roundEl.textContent = `${Math.min(currentIndex + 1, total)}/${total}`;
      correctEl.textContent = correctCount;
      scoreEl.textContent = score;
      wrongAttemptsEl.textContent = `${wrongAttempts}/3`;
      starsEl.textContent = stars;
      barEl.style.width = `${total ? (solvedCount / total) * 100 : 0}%`;
    }

    function renderQuestion() {
      if (!deck.length) return;

      current = deck[currentIndex];
      answered = false;
      nextBtn.disabled = true;
      nextBtn.textContent = "下一題";
      wordEl.textContent = questionMainText(current);
      kkEl.textContent = questionSubText(current);
      document.querySelector(".prompt-label").textContent = promptText();
      messageEl.textContent = quizModeEl.value === "zh_to_en"
        ? "請選出正確的英文！"
        : "請選出正確的中文意思！";
      optionsEl.innerHTML = "";

      const options = buildOptions(current);
      options.forEach(item => {
        const btn = document.createElement("button");
        btn.className = "option";
        btn.textContent = optionText(item);
        btn.dataset.id = item.id;
        btn.addEventListener("click", () => chooseOption(btn, item));
        optionsEl.appendChild(btn);
      });

      updateStats();
      setBuddyMood("thinking", "這題我看好你！");
      setTimeout(speakQuestion, 250);
    }

    function showScorePop(text, type) {
      const pop = document.createElement("div");
      pop.className = `score-pop ${type}`;
      pop.textContent = text;
      document.body.appendChild(pop);
      setTimeout(() => pop.remove(), 950);
    }

    function showReward(text, emoji, showStars = false) {
      rewardEmojiEl.textContent = emoji;
      rewardTextEl.textContent = text;
      rewardStarsEl.style.display = showStars ? "block" : "none";
      rewardEl.classList.remove("show");
      void rewardEl.offsetWidth;
      rewardEl.classList.add("show");
    }


    function autoAdvanceAfterCorrect() {
      nextBtn.disabled = true;
      nextBtn.textContent = "自動下一題...";
      setTimeout(() => {
        if (currentIndex >= deck.length - 1) {
          finishGame();
        } else {
          currentIndex++;
          nextBtn.textContent = "下一題";
          renderQuestion();
        }
      }, Number(autoNextDelayEl.value));
    }

    function chooseOption(button, item) {
      if (answered) return;
      ensureAudio();
      answered = true;

      const isCorrect = item.id === current.id;
      const buttons = [...optionsEl.querySelectorAll(".option")];

      buttons.forEach(btn => {
        btn.disabled = true;
        if (btn.dataset.id === current.id) btn.classList.add("reveal");
      });

      if (isCorrect) {
        button.classList.add("correct");
        correctCount++;
        score += 10;
        removeWrong(current.id);
        playCorrect();
        showScorePop("+10", "good");
        setBuddyMood("happy", "答對了！+10");
        messageEl.textContent = `答對！${current.en} = ${current.zh}，停一下再進下一題...`;
        if (quizModeEl.value === "zh_to_en") setTimeout(speakAnswerWord, 150);
      } else {
        button.classList.add("wrong");
        wrongAttempts++;
        recordWrong(current.id);
        playWrong();

        if (wrongAttempts >= 3) {
          score = Math.max(0, score - 5);
          wrongAttempts = 0;
          showScorePop("-5", "bad");
          setBuddyMood("sad", "錯 3 次，扣 5 分；錯題已記錄！");
          messageEl.textContent = quizModeEl.value === "zh_to_en"
            ? `錯 3 次，扣 5 分。這題已記錄。正確答案：${current.en}`
            : `錯 3 次，扣 5 分。這題已記錄。正確答案：${current.zh}`;
        } else {
          showScorePop(`錯 ${wrongAttempts}/3`, "bad");
          setBuddyMood("sad", `錯 ${wrongAttempts}/3，已記錄！`);
          messageEl.textContent = quizModeEl.value === "zh_to_en"
            ? `答錯一次就已記錄，下次會優先重現。錯誤 ${wrongAttempts}/3。正確答案：${current.en}`
            : `答錯一次就已記錄，下次會優先重現。錯誤 ${wrongAttempts}/3。正確答案：${current.zh}`;
        }
      }

      updateStats();

      if (isCorrect) {
        autoAdvanceAfterCorrect();
      } else {
        nextBtn.disabled = false;
        if (currentIndex === deck.length - 1) {
          nextBtn.textContent = "看結果";
        }
      }
    }

    function finishGame() {
      const perfect = correctCount === deck.length;
      barEl.style.width = "100%";

      if (perfect) {
        stars = 3;
        playWin();
        showReward("全部答對！", "🏆", true);
        setBuddyMood("happy", "太強了！3 顆星星！");
        messageEl.textContent = `全部答對！得到 3 顆星星。總分 ${score}`;
      } else {
        stars = correctCount >= Math.ceil(deck.length * 0.8) ? 2 : correctCount >= Math.ceil(deck.length * 0.5) ? 1 : 0;
        showReward(`完成！${stars} 顆星`, stars ? "⭐" : "💪", stars === 3);
        setBuddyMood(stars ? "happy" : "thinking", "再玩一次會更熟！");
        messageEl.textContent = `完成！答對 ${correctCount}/${deck.length}，得到 ${stars} 顆星。總分 ${score}`;
      }

      updateStats();
      nextBtn.disabled = true;
    }

    function nextQuestion() {
      if (currentIndex >= deck.length - 1) {
        finishGame();
        return;
      }
      currentIndex++;
      renderQuestion();
    }

    function newGame() {
      if (!wordBank.length) {
        messageEl.textContent = "找不到 word_quest_word_bank.js，請確認單字庫和 HTML 放同一個資料夾。";
        return;
      }

      deck = buildDeck();
      currentIndex = 0;
      correctCount = 0;
      score = 0;
      stars = 0;
      wrongAttempts = 0;
      nextBtn.textContent = "下一題";
      renderQuestion();
      renderWrongList();
    }

    volumeEl.addEventListener("input", updateVolumeUI);
    musicStyleEl.addEventListener("change", updateMusicStyle);
    musicToggleEl.addEventListener("click", () => {
      if (musicEnabled) stopMusic();
      else startMusic();
    });
    document.getElementById("newGame").addEventListener("click", newGame);
    document.getElementById("speakBtn").addEventListener("click", speakQuestion);
    document.getElementById("speakBtn2").addEventListener("click", speakQuestion);
    nextBtn.addEventListener("click", nextQuestion);
    roundCountEl.addEventListener("change", newGame);
    quizModeEl.addEventListener("change", () => {
      localStorage.setItem(QUIZ_MODE_KEY, quizModeEl.value);
      newGame();
    });

    autoNextDelayEl.addEventListener("change", () => {
      localStorage.setItem(AUTO_NEXT_DELAY_KEY, autoNextDelayEl.value);
    });
    characterSelectEl.addEventListener("change", () => setCharacter(characterSelectEl.value));

    loadVolume();
    loadMusicStyle();

    const savedMode = localStorage.getItem(QUIZ_MODE_KEY);
    if (savedMode && [...quizModeEl.options].some(opt => opt.value === savedMode)) {
      quizModeEl.value = savedMode;
    }

    const savedDelay = localStorage.getItem(AUTO_NEXT_DELAY_KEY);
    if (savedDelay && [...autoNextDelayEl.options].some(opt => opt.value === savedDelay)) {
      autoNextDelayEl.value = savedDelay;
    }

    const savedCharacter = localStorage.getItem(CHARACTER_KEY) || "lion";
    characterSelectEl.value = savedCharacter;
    setCharacter(savedCharacter);
    renderWrongList();
    newGame();
  </script>
</body>
</html>
